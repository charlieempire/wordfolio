<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f9fc"><title>词页 · 我的词汇库</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%236444ce'/%3E%3Cpath fill='white' d='m7 11 12 3v17L7 28zm26 0-12 3v17l12-3z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=10"></head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="book" viewBox="0 0 24 24"><path d="M3 5q5-1 9 2 4-3 9-2v14q-5-1-9 2-4-3-9-2zM12 7v14"/></symbol>
<symbol id="checkbook" viewBox="0 0 24 24"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="m9 12 2 2 5-5"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M5 4a1 1 0 0 1 1-1h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM14 3v6h5M9 13h6M9 17h4"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5.5 5.5"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
<symbol id="disk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
<symbol id="tune" viewBox="0 0 24 24"><path d="M3 7h4m5 0h9M3 17h9m5 0h4"/><circle cx="9.5" cy="7" r="2.5"/><circle cx="14.5" cy="17" r="2.5"/></symbol>
</defs></svg>
<header><div class="top inner"><div class="brand"><span class="brandmark"><svg><use href="#book"/></svg></span><b>词页</b><span class="english">Wordfolio</span></div>
<nav aria-label="词库视图"><button id="study"><svg><use href="#book"/></svg>学习词表</button><button id="easy"><svg><use href="#checkbook"/></svg>简单词表</button><button id="mastered"><svg><use href="#check"/></svg>已会词表</button><button id="quiz"><svg><use href="#check"/></svg>检验模式</button></nav>
<div class="top-actions"><button class="prefs-open" id="openPrefs" aria-label="偏好设置" title="偏好设置"><svg><use href="#tune"/></svg><span>偏好设置</span></button><button class="primary import" id="openImport"><svg><use href="#up"/></svg>导入 / 备份</button></div></div></header>
<main class="inner">
<section class="hero"><div><h1>我的词汇库</h1><div class="stats"><div><b id="studyCount"></b><span>待学词条</span></div><div><b id="easyCount"></b><span>简单词</span></div><div><b id="masteredCount"></b><span>已会词</span></div><div><b id="listCount"></b><span>导入词表</span></div></div></div>
<div class="art" aria-hidden="true"><i class="spark s1"></i><i class="spark s2"></i><i class="yellowdot"></i><div class="card c3"></div><div class="card c2"></div><div class="card c1"><b>Aa</b><i></i><i></i></div></div></section>
<div class="workspace" id="listWorkspace"><aside><h2>我的词表</h2><div id="sources"></div><p class="device"><svg><use href="#disk"/></svg>保存在此浏览器</p></aside>
<section class="library" aria-label="词汇清单"><div class="libhead"><div class="titleline"><h2 id="listTitle"></h2><span id="total"></span></div><label class="search"><svg><use href="#search"/></svg><input id="query" type="search" placeholder="搜索单词或释义" aria-label="搜索单词或释义"></label></div>
<div class="toolrow"><label class="selectall"><input type="checkbox" id="all">全选</label><button id="move" class="move"></button><button id="moveMastered" class="move"></button><div class="fontbar"><span>字号</span><button id="smaller" aria-label="减小字号">A−</button><button id="larger" aria-label="增大字号">A+</button></div></div>
<div id="words"></div><div id="empty" hidden></div></section></div>
<div class="workspace" id="quizWorkspace" hidden>
<aside><h2>检验词表</h2><label class="quiz-source quiz-all"><input id="quizAll" type="checkbox">全部待学词表</label><label class="quiz-source"><input id="quizMastered" type="checkbox">已会词表</label><div id="quizSources"></div></aside>
<section class="library quiz-library" aria-label="随机词汇检验">
  <div class="libhead"><div class="titleline"><h2>检验模式</h2><span id="quizCount"></span></div>
  <div class="fontbar"><span>字号</span><button id="quizSmaller" aria-label="减小检验字号">A−</button><button id="quizLarger" aria-label="增大检验字号">A+</button></div></div>
  <div class="quiz-card">
    <div class="quiz-direction" role="group" aria-label="出题语言"><button id="quizAskEnglish" aria-pressed="true">英文出题</button><button id="quizAskChinese" aria-pressed="false">中文出题</button></div>
    <div class="quiz-face" aria-live="polite" aria-atomic="true"><div id="quizProgress"></div><strong id="quizEnglish" lang="en"></strong><p id="quizMeaning" hidden></p><p id="quizEmpty" hidden></p></div>
    <div class="quiz-actions"><button id="quizPrev">上一个</button><button class="primary" id="quizReveal" aria-controls="quizMeaning" aria-expanded="false">显示翻译</button><button id="quizNext">下一个</button></div>
    <button id="quizMarkMastered" class="move" disabled>移入已会词表</button>
  </div>
</section></div>
</main>
<dialog id="importBox"><div class="modalhead"><h2>导入词表</h2><button class="iconbtn" id="dismiss" aria-label="关闭"><svg><use href="#close"/></svg></button></div>
<p class="hint">选择含英文和中文释义的 Excel 或 CSV 文件。</p>
<button class="drop" id="pick"><svg><use href="#up"/></svg><b>点击选择或拖入文件</b><small>.xlsx / .csv · 支持多选</small></button><input id="files" type="file" accept=".xlsx,.csv" multiple hidden>
<p class="hint footnote">自动跳过简单词和已会词。不同词表可收录同一英文并保留各自的释义，同一词表内保留首次释义。</p>
<fieldset id="backupTools"><legend>个人备份</legend>
<p class="hint">保存所有词表、简单词、已会词、偏好及检验进度。</p>
<div class="backup-actions"><button id="exportBackup">导出备份</button><button id="pickBackup">导入备份</button></div>
<input id="backupFile" type="file" accept=".zip,.json" hidden></fieldset>
<div id="result" role="status" aria-live="polite"></div></dialog>
<dialog id="backupBox" aria-labelledby="backupTitle">
<div class="modalhead"><h2 id="backupTitle">导入个人备份</h2><button class="iconbtn" id="cancelBackup" aria-label="取消导入"><svg><use href="#close"/></svg></button></div>
<p id="backupSummary" class="hint"></p>
<fieldset class="backup-options"><legend>导入方式</legend>
<label><input type="radio" name="backupMode" id="backupMerge" checked><span><b>补充</b><small>按词表补充词条和分类标记，跳过本机简单词和已会词。同一词表的已有释义和本机设置优先。</small></span></label>
<label><input type="radio" name="backupMode" id="backupReplace"><span><b>全部替换</b><small>用备份覆盖本机所有词表、分类、偏好和进度。本机独有的内容将被移除。</small></span></label>
</fieldset>
<p id="backupStatus" role="status" aria-live="polite"></p><button class="primary" id="applyBackup">确认补充</button></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="prefsBox" aria-labelledby="prefsTitle">
<div class="prefs-head"><div class="modalhead"><h2 id="prefsTitle">偏好设置</h2><button id="prefsCancel" class="iconbtn" aria-label="关闭偏好设置"><svg><use href="#close"/></svg></button></div>
<p class="hint">点击操作右侧的按键，再按下新的单键或组合键。</p></div>
<div id="bindings"></div>
<div class="prefs-foot"><p id="prefsMessage" role="status" aria-live="polite"></p><div><button id="prefsDefaults">恢复默认</button><button id="prefsSave" class="primary">保存设置</button></div></div></dialog>
<script src="jszip.min.js"></script><script src="seed.js"></script><script src="import.js?v=3"></script><script src="library-store.js?v=4"></script><script src="quiz.js?v=5"></script><script src="app.js?v=11"></script><script src="shortcuts.js?v=5"></script><script src="backup.js?v=2"></script>
</body></html>
